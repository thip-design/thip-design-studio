<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>คำสั่งซื้อ — THIP Wedding Studio</title><link rel="stylesheet" href="/site.css"><style>.orders{max-width:1100px;margin:auto;padding:50px 20px}.order{border:1px solid var(--line);background:var(--cream);padding:22px;margin:18px 0}.order h2{margin:0 0 8px}.order-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.order img{max-width:100%;max-height:260px;object-fit:contain;background:#fff;border:1px solid var(--line);padding:8px}.order-meta{line-height:1.9;color:var(--muted)}@media(max-width:700px){.order-grid{grid-template-columns:1fr}}</style></head><body><main class="orders"><h1>คำสั่งซื้อ</h1><p>รายละเอียดงานและไฟล์ที่ลูกค้าอัปโหลด</p><div id="list">กำลังโหลด...</div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/orders').then(r=>r.json()).then(orders=>{document.querySelector('#list').innerHTML=orders.reverse().map(o=>{const f=o.fields||{},files=o.files||[];return `<article class="order"><h2>${esc(o.id)}</h2><div class="order-meta">สถานะ: ${esc(o.status)}<br>ชื่อ: ${esc(f.customer)}<br>อีเมล: ${esc(f.email)}<br>โทร: ${esc(f.phone)}<br>ที่อยู่จัดส่ง: ${esc(f.shippingAddress)}<br>สินค้า: ${esc(f.product)}<br>ค่าจัดส่ง: ${esc(f.shippingFee)} บาท</div><div class="order-grid">${files.map(x=>{const url='/data/orders/'+encodeURIComponent(o.id)+'/'+encodeURIComponent(x.filename);return `<div><p>${esc(x.field)}: ${esc(x.filename)}</p>${/\.(png|jpe?g|webp)$/i.test(x.filename)?`<img src="${url}" alt="${esc(x.field)}">`:`<a href="${url}" target="_blank">เปิดไฟล์</a>`}</div>`}).join('')}</div></article>`}).join('')||'<p>ยังไม่มีคำสั่งซื้อ</p>'}).catch(e=>document.querySelector('#list').textContent='ไม่สามารถโหลดคำสั่งซื้อได้: '+e.message);</script></body></html>
